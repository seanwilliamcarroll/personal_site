version: 1
frontend:
  phases:
    preBuild:
      commands:
        # The Node in .nvmrc, not whatever the build image defaults to
        # (which is how CI and local development choose theirs too).
        - nvm install
        - node -v
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
