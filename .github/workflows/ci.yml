# CI: the same checks as the git hooks (install-hooks.sh), on every pull
# request, so a PR is checked even if it was pushed from a machine without
# the hooks. `main` is protected: this check must pass before a merge.
#
# Not run on pushes to `main`: Amplify builds and deploys those itself.
name: CI

on:
  pull_request:
  workflow_dispatch:

# A newer push to the same PR cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Actions are pinned by commit: a tag can be moved.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The Node in .nvmrc: the same file Amplify's build follows
      # (amplify.yml) and `nvm use` reads locally.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: npm ci
        run: npm ci

      # --- pre-commit ---
      # The hook rewrites staged files; here it only checks.
      - name: Prettier
        run: npm run format:check
      - name: ESLint
        run: npm run lint

      # --- pre-push ---
      # `astro check` (types), the build, and the Pagefind index.
      - name: Build
        run: npm run build
