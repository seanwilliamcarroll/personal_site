# CI: the same checks as the git hooks (install-hooks.sh), on every pull
# request, so a PR is checked even if it was pushed from a machine without
# the hooks. `main` is protected: this check must pass before a merge.
#
# Not run on pushes to `main`: Amplify builds and deploys those itself.
name: CI

on:
  pull_request:
  workflow_dispatch:

# A newer push to the same PR cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Actions are pinned by commit: a tag can be moved.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The Node in .nvmrc: the same file Amplify's build follows
      # (amplify.yml) and `nvm use` reads locally.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: npm ci
        run: npm ci

      # --- pre-commit ---
      # The hook rewrites staged files; here it only checks.
      - name: Prettier
        run: npm run format:check
      - name: ESLint
        run: npm run lint

      # --- pre-push ---
      # `astro check` (types), the build, and the Pagefind index.
      - name: Build
        run: npm run build

      # What only the published build may have, and must: the analytics
      # tag (src/utils/analytics.ts), and no drafts (src/utils/drafts.ts).
      - name: The build has the analytics tag and no drafts
        run: |
          grep -q 'googletagmanager.com/gtag/js?id=G-' dist/index.html
          test ! -e dist/posts/demo-wrapper-check

      # The social-preview images: nothing else looks at them, and a
      # dependency upgrade once drew them wrongly without an error.
      - name: The preview images are framed as intended
        run: npm run check:og

  # The embedded demos, in a real browser (tests/, playwright.config.ts):
  # a second build, with drafts and without the analytics tag, so the
  # wrapper's test pages exist and a test run isn't counted as a visit.
  demos:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: npm ci
        run: npm ci

      # The Chromium that this version of Playwright is built against,
      # and the system libraries it needs.
      - name: Chromium
        run: npx playwright install --with-deps chromium

      - name: Demo tests
        run: npm run test:demos

      # A failed test's recording: open playwright-report/index.html.
      - name: Keep the report of a failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
